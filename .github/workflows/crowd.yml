name: Crowd snapshots

# Weekday peaks only, every 30 min (SGT 06:15-09:45 and 17:15-19:45): save LTA's live platform crowd level for every
# station so it can be checked against that morning's forecast (scripts/watch.py). GitHub may start runs a few minutes late.
on:
  schedule:
    - cron: "15,45 22,23 * * 0-4"   # 06:15-07:45 SGT Mon-Fri (still Sun-Thu in UTC)
    - cron: "15,45 0,1 * * 1-5"     # 08:15-09:45 SGT
    - cron: "15,45 9,10,11 * * 1-5" # 17:15-19:45 SGT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-bot
  cancel-in-progress: false

jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Live crowd (and today's forecast if missing)
        env:
          LTA_ACCOUNT_KEY: ${{ secrets.LTA_ACCOUNT_KEY }}
        run: python scripts/fetch_lta.py --crowd-only
      - name: Forecast accuracy
        run: python scripts/watch.py
        continue-on-error: true
      - name: Commit
        run: |
          git config user.name "sg-transit-planner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/lta docs/data/crowd_now.json docs/data/crowd_forecast.json docs/data/watch.json
          git diff --cached --quiet || git commit -m "crowd: $(TZ=Asia/Singapore date +'%Y-%m-%d %H:%M') SGT"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 10; done
