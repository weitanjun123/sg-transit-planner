name: Data bot

# Daily 06:17 SGT: today's LTA crowd forecast + live crowd, new monthly passenger volumes when LTA publishes them,
# HDB blocks (geocoding resumes until every block is located), then re-run the analysis and commit.
on:
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-bot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy

      - name: LTA DataMall (crowd + passenger volume)
        env:
          LTA_ACCOUNT_KEY: ${{ secrets.LTA_ACCOUNT_KEY }}
        run: python scripts/fetch_lta.py
        continue-on-error: true

      - name: HDB blocks (data.gov.sg property info + building footprints)
        run: python scripts/fetch_hdb.py
        continue-on-error: true

      - name: Home prices (HDB resale; URA private if key added)
        env:
          URA_ACCESS_KEY: ${{ secrets.URA_ACCESS_KEY }}
        run: python scripts/fetch_prices.py
        continue-on-error: true
        env:
          URA_ACCESS_KEY: ${{ secrets.URA_ACCESS_KEY }}

      - name: Amenities (schools, hawkers, clinics, parks...) + housing grant counts
        run: python scripts/fetch_amenities.py
        continue-on-error: true

      - name: Early wakers / night owls report
        run: python scripts/report.py
        continue-on-error: true

      - name: Deep-dive insights (routing, bus feeders, station types, heartbeat)
        run: python scripts/insights.py
        continue-on-error: true

      - name: Gap analysis + proposed lines
        run: python scripts/analyse.py

      - name: Prices vs MRT
        run: python scripts/prices.py
        continue-on-error: true

      - name: Money test (cost vs benefit)
        run: python scripts/economics.py
        continue-on-error: true

      - name: 2030 crowding stress test
        run: python scripts/future.py
        continue-on-error: true

      - name: Watch list (rising stations + LTA forecast accuracy)
        run: python scripts/watch.py
        continue-on-error: true

      - name: Commit data
        run: |
          git config user.name "sg-transit-planner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Singapore date +'%Y-%m-%d %H:%M') SGT"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 10; done
