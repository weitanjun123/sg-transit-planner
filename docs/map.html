<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SG Transit Planner — Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --ink:#e9ecf1; --mute:#9aa3ae; --gold:#f2c14e; --red:#e5484d; --pink:#ff4fd8; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  #map { position:absolute; inset:0 0 0 360px; }
  #panel { position:absolute; inset:0 auto 0 0; width:360px; overflow:auto; background:var(--panel); padding:14px 16px 40px; border-right:1px solid #2b3038; }
  h1 { font-size:18px; margin:0 0 2px; } h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); margin:18px 0 8px; }
  a { color:var(--gold); } .mute { color:var(--mute); font-size:12px; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .stat { background:#252932; border-radius:8px; padding:8px 10px; } .stat b { display:block; font-size:18px; }
  .line { background:#252932; border-radius:8px; padding:10px; margin:0 0 8px; cursor:pointer; border-left:4px solid var(--pink); }
  .line:hover { background:#2c313b; } .line h3 { margin:0 0 4px; font-size:14px; }
  .chips span { display:inline-block; font-size:11px; padding:1px 6px; margin:2px 3px 0 0; border-radius:10px; background:#323845; }
  .banner { background:#3a2f12; color:#f6dfa0; padding:8px 10px; border-radius:8px; font-size:12px; margin:10px 0; }
  .yr { display:flex; gap:6px; flex-wrap:wrap; } .yr button { flex:1; background:#2a2f39; color:var(--ink); border:1px solid #3a404c; border-radius:6px; padding:6px 0; cursor:pointer; }
  .yr button.on { background:var(--gold); color:#111; border-color:var(--gold); font-weight:600; }
  label.tg { display:flex; gap:8px; align-items:center; margin:4px 0; }
  .leaflet-popup-content { font-size:13px; } .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  @media (max-width: 760px) {
    #map { inset:0 0 45vh 0; } #panel { inset:55vh 0 0 0; width:auto; border-right:0; border-top:1px solid #2b3038; }
  }
</style>
</head>
<body>
<div id="panel">
  <h1>SG Transit Planner</h1>
  <div class="mute">Open-source MRT gap finder · <a href="./">home</a> · <a href="sim.html">pixel MRT sim</a></div>
  <div id="banner"></div>
  <h2>Network year</h2>
  <div class="yr" id="years"></div>
  <div class="mute" style="margin-top:6px">Shows LTA's open + announced stations as of that year. Dashed grey = corridors still under study.</div>
  <h2>Layers</h2>
  <label class="tg"><input type="checkbox" id="lyGaps" checked> Residents &gt;10-min walk from MRT</label>
  <label class="tg"><input type="checkbox" id="lyProp" checked> Proposed new lines &amp; stations</label>
  <label class="tg"><input type="checkbox" id="lyFuture" checked> New BTO &amp; land-sale sites</label>
  <label class="tg"><input type="checkbox" id="lyCrowd" checked> Today's AM-peak crowd (LTA)</label>
  <h2>Summary</h2>
  <div class="stats" id="stats"></div>
  <h2>Proposed lines</h2>
  <div id="lines"></div>
  <h2>Infill stations</h2>
  <div id="infill" class="mute"></div>
  <h2>Already fixed by LTA's plans</h2>
  <div id="fixed" class="mute"></div>
  <h2>How it works</h2>
  <div class="mute" id="method"></div>
</div>
<div id="map"></div>
<script>
const fmt = n => n == null ? '–' : Math.round(n).toLocaleString('en-SG');
const get = p => fetch(p, {cache:'no-store'}).then(r => r.ok ? r.json() : null).catch(() => null);
const map = L.map('map', {zoomControl:true, preferCanvas:true}).setView([1.355, 103.82], 12);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:18 }).addTo(map);
const G = { net:L.layerGroup().addTo(map), gaps:L.layerGroup().addTo(map), prop:L.layerGroup().addTo(map),
            fut:L.layerGroup().addTo(map), crowd:L.layerGroup().addTo(map) };
const YEARS = [[2026.9,'Today'],[2027,'2027'],[2028.6,'2028'],[2030,'2030'],[2032,'2032'],[2040,'2040']];
let ST, AN, FC, year = 2026.9;

function drawNetwork() {
  G.net.clearLayers();
  const byId = Object.fromEntries(ST.stations.map(s => [s.id, s]));
  for (const e of ST.edges) {
    const ln = ST.lines[e.line]; if (!ln) continue;
    if (e.open_year > year || (e.until != null && year >= e.until)) continue;
    const a = byId[e.a], b = byId[e.b];
    L.polyline([[a.lat,a.lon],[b.lat,b.lon]], {color:ln.color, weight: ln.mode==='LRT'?2:4,
      opacity: e.open_year > 2026.9 ? .55 : .95, dashArray: e.open_year > 2026.9 ? '6 6' : null}).addTo(G.net);
  }
  for (const c of ST.corridors) if (c.path.length) L.polyline(c.path, {color:'#8b93a1', weight:3, dashArray:'2 8'})
    .bindPopup(`<b>${c.name}</b><br>${c.status}<br><a href="${c.source}" target="_blank">source</a>`).addTo(G.net);
  for (const s of ST.stations) {
    if (s.open_year > year) continue;
    const future = s.open_year > 2026.9;
    const col = ST.lines[(s.codes[0].code.match(/^[A-Z]+/)||[''])[0]]?.color || '#fff';
    L.circleMarker([s.lat,s.lon], {radius: s.mode==='LRT'?2.5:4, color: future ? col : '#fff', weight:2,
      fillColor: future ? '#14161a' : col, fillOpacity:1})
      .bindPopup(`<b>${s.name}</b><br>` + s.codes.map(c => `${c.code} · ${c.opening === 'open' ? 'open' : c.opening}`).join('<br>')
        + `<br><span class="mute">coords: ${s.coord_source}</span>`).addTo(G.net);
  }
}

function drawCrowd() {
  G.crowd.clearLayers();
  if (!FC || !document.getElementById('lyCrowd').checked) return;
  const code2s = {}; for (const s of ST.stations) for (const c of s.codes) code2s[c.code] = s;
  for (const [code, slots] of Object.entries(FC.stations)) {
    const s = code2s[code]; if (!s) continue;
    const am = slots.filter(([t]) => t >= '07:00' && t < '09:00').map(x => x[1]);
    const h = am.filter(l => l === 'h').length / (am.length || 1);
    if (h > 0) L.circleMarker([s.lat, s.lon], {radius: 7 + 8*h, color:'#e5484d', weight:2, fill:false, opacity:.85})
      .bindPopup(`<b>${s.name}</b> (${code})<br>LTA forecast ${FC.date}: crowded in ${Math.round(h*100)}% of 07:00–09:00 slots`).addTo(G.crowd);
  }
}

function drawAnalysis() {
  G.gaps.clearLayers(); G.prop.clearLayers(); G.fut.clearLayers();
  if (document.getElementById('lyGaps').checked)
    for (const [lat, lon, pop, w, d] of AN.gaps.slice(0, 4000)) if (pop > 100)
      L.circle([lat, lon], {radius: 150, stroke:false, fillColor:'#e5484d', fillOpacity: Math.min(.75, .12 + pop/6000)})
        .bindPopup(`~${fmt(pop)} residents<br>nearest MRT today: ${fmt(d)} m (straight line)`).addTo(G.gaps);
  if (document.getElementById('lyProp').checked) {
    AN.lines.forEach((l, i) => {
      const pts = l.stations.map(p => [p.lat, p.lon]);
      L.polyline(pts, {color:'#ff4fd8', weight:5, dashArray:'10 6'}).bindPopup(`<b>${l.name}</b><br>${l.why}`).addTo(G.prop);
      l.stations.forEach(p => L.circleMarker([p.lat,p.lon], {radius: p.site?7:5, color:'#ff4fd8', weight:3, fillColor: p.site?'#fff':'#ff4fd8', fillOpacity:1})
        .bindPopup(`<b>${p.name}</b><br>${l.name}`).addTo(G.prop));
    });
    AN.infill.forEach(s => L.circleMarker([s.lat,s.lon], {radius:7, color:'#ff4fd8', weight:3, fillColor:'#fff', fillOpacity:1})
      .bindPopup(`<b>Infill: ${s.area}</b><br>${s.line}, between ${s.between.join(' and ')}<br>${fmt(s.new_residents)} residents within 10-min walk`).addTo(G.prop));
  }
  if (document.getElementById('lyFuture').checked && AN.future)
    AN.future.forEach(f => L.marker([f.lat, f.lon], {icon: L.divIcon({className:'', html:`<div style="background:${f.type==='BTO'?'#f2c14e':'#4fb3ff'};color:#111;font:600 10px system-ui;padding:1px 4px;border-radius:4px;white-space:nowrap">${f.type} ${fmt(f.units)}</div>`})})
      .bindPopup(`<b>${f.name}</b> (${f.town})<br>${f.type} · ${fmt(f.units)} units · ${f.launch}<br><a href="${f.source}" target="_blank">source</a>`).addTo(G.fut));
}

function panel() {
  const s = AN.summary, inp = AN.inputs;
  let b = '';
  if (!inp.hdb_blocks) b += '<div class="banner">HDB block data has not loaded yet. Until then, gaps and proposals use only the new BTO and land-sale sites.</div>';
  if (!inp.lta_passenger_volume && !inp.lta_crowd_forecast) b += '<div class="banner">LTA crowd data not loaded yet — add the LTA_ACCOUNT_KEY secret. Crowding is not weighted in until then.</div>';
  document.getElementById('banner').innerHTML = b;
  document.getElementById('stats').innerHTML = [
    ['Residents mapped', s.residents_now], ['Future (BTO + GLS)', s.future_residents],
    ['Beyond 10-min walk today', s.unserved_now], ['Still beyond after LTA plans', s.unserved_after_lta_plans]]
    .map(([k,v]) => `<div class="stat"><span class="mute">${k}</span><b>${fmt(v)}</b></div>`).join('');
  document.getElementById('lines').innerHTML = AN.lines.length ? AN.lines.map((l, i) =>
    `<div class="line" data-i="${i}"><h3>${l.name} · ${l.length_km} km</h3><div class="mute">${l.why}</div>
     <div class="chips">${l.stations.map(p => `<span>${p.interchange?'⇄ ':''}${p.name.replace('New: ','★ ')}</span>`).join('')}</div></div>`).join('')
    : '<div class="mute">No new line clears the threshold yet.</div>';
  document.querySelectorAll('.line').forEach(el => el.onclick = () => {
    const l = AN.lines[+el.dataset.i]; map.fitBounds(l.stations.map(p => [p.lat,p.lon]), {padding:[40,40]}); });
  document.getElementById('infill').innerHTML = AN.infill.map(s => `★ ${s.area}: ${s.line} between ${s.between.join(' & ')} — ${fmt(s.new_residents)} residents`).join('<br>') || 'None.';
  document.getElementById('fixed').innerHTML = AN.fixed_by_lta_plans.slice(0, 10).map(f => `${f.station}: ${fmt(f.residents)} residents`).join('<br>') || '–';
  const P = AN.params;
  document.getElementById('method').innerHTML =
    `Residents = HDB dwelling units × ${P.persons_per_unit}. A home counts as served if an MRT station (open or announced by LTA) is within ~${P.walk_radius_m} m straight line (≈10-min walk). Unserved residents count double when their current nearest station is crowded in the 7–9am peak (LTA data). New stations are placed greedily where they serve the most people, ≥${P.min_site_spacing_m/1000} km from any station, and only if they serve ≥${fmt(P.min_new_residents)} residents. These are starting points for planners, not engineering alignments.<br><br>Updated ${AN.generated}. <a href="https://github.com/weitanjun123/sg-transit-planner">Code &amp; data</a>`;
}

(async () => {
  [ST, AN, FC] = await Promise.all([get('data/stations.json'), get('data/analysis.json'), get('data/crowd_forecast.json')]);
  const yb = document.getElementById('years');
  YEARS.forEach(([y, lab]) => { const b = document.createElement('button'); b.textContent = lab; if (y === year) b.className = 'on';
    b.onclick = () => { year = y; [...yb.children].forEach(c => c.className = ''); b.className = 'on'; drawNetwork(); }; yb.appendChild(b); });
  drawNetwork(); drawCrowd(); if (AN) { drawAnalysis(); panel(); }
  ['lyGaps','lyProp','lyFuture'].forEach(id => document.getElementById(id).onchange = drawAnalysis);
  document.getElementById('lyCrowd').onchange = drawCrowd;
})();
</script>
</body>
</html>
